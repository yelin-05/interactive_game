name: build

on:
  push:
    # 仓库主分支叫 master（GitHub Desktop 默认），一并兜住 main 和开发分支
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Make wrapper executable
        # 仓库在 Windows 上创建，mvnw 可能没带可执行位，Linux runner 上会 Permission denied
        run: chmod +x ./mvnw

      - name: Build & test (H2 profile, no MySQL needed)
        run: ./mvnw -B -ntp verify

      - name: Upload jar
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: minigame-asset-jar
          path: target/*.jar
          retention-days: 7
