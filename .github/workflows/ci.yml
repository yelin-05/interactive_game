name: build

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: temurin
          cache: maven
          cache-dependency-path: javaee/pom.xml

      - name: Make wrapper executable
        run: chmod +x ./mvnw

      - name: Test and build JavaEE WAR
        run: ./mvnw -B -ntp -f javaee/pom.xml test package

      - name: Upload WAR
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: moshi-war
          path: javaee/target/*.war
          retention-days: 7
