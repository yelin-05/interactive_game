# =====================================================================
#  H2 内存档（演示 / 单元测试 / GitHub 上 clone 即跑）
#  启动：mvnw spring-boot:run -Dspring-boot.run.profiles=h2
#  控制台：http://localhost:8080/h2-console  JDBC URL 见下方 url
# =====================================================================
spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:minigame;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema-h2.sql
      data-locations: classpath:db/data-h2.sql
  h2:
    console:
      enabled: true
      path: /h2-console

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

logging:
  level:
    com.example.minigame: debug
