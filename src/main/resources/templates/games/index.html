<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>选一个游戏模板</title>
  <link rel="stylesheet" th:href="@{/css/game.css}">
</head>
<body class="game-page">

<div class="wrap">
  <h1>选一个游戏模板</h1>
  <p class="lead">
    <b>C · 知识闯关已选定</b>，正在往「题库分区 + 数据库存题」方向做：题目不再写死在前端，
    而是存进 <code>t_question</code> 表，按计算机 / 文学 / 地理 / 历史 / 科学 五个分区随机抽题。<br>
    A、B 两个模板先留着没删，随时可以回头改主意。
  </p>

  <div class="tpl-grid">
    <article class="tpl" th:each="t : ${templates}">
      <div class="tpl-top">
        <span class="tpl-tag" th:text="${t.code}">reaction</span>
        <span class="tpl-diff" th:text="'难度 ' + ${t.difficulty}">难度 低</span>
        <span class="chosen" th:if="${t.code == 'quiz'}">✓ 已选定</span>
      </div>
      <h2 th:text="${t.name}">A · 打地鼠</h2>
      <p th:text="${t.desc}">玩法描述</p>
      <div class="tpl-meta">
        <span class="chip" th:text="${t.tag}">反应力</span>
        <span class="chip" th:text="${t.duration}">30 秒</span>
        <span class="chip" th:text="'适配：' + ${t.modules}">适配</span>
      </div>
      <a class="btn btn-primary" th:href="@{'/games/' + ${t.code}}">进入试玩 →</a>
    </article>
  </div>
</div>

</body>
</html>
