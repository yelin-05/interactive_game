<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>C · 知识闯关</title>
  <link rel="stylesheet" th:href="@{/css/game.css}">
</head>
<body class="game-page">

<header class="gbar">
  <a class="gback" th:href="@{/games}">← 返回选型</a>
  <span class="gtitle">C · 知识闯关</span>
  <span class="gtag">答题</span>
</header>

<main class="stage wide">

  <!-- ================= 选分区 ================= -->
  <section id="view-pick">
    <div class="pick-head">
      <h2>选一个分区开始</h2>
      <p>每个分区随机抽 5 题，每题限时 15 秒。答对得 10 分 + 剩余秒数加成，答得越快分越高。</p>
    </div>

    <div class="pick-grid" id="pick-grid">
      <div class="pick-loading">题库加载中…</div>
    </div>

    <p class="pick-tip" id="pick-tip"></p>
  </section>

  <!-- ================= 答题 ================= -->
  <section id="view-play" hidden>
    <div class="hud">
      <div class="hud-item"><span class="lab">得分</span><b id="hud-score">0</b></div>
      <div class="hud-item"><span class="lab">本题剩余</span><b id="hud-time">15</b></div>
      <div class="hud-item"><span class="lab">答对</span><b id="hud-right">0</b></div>
      <div class="hud-item"><span class="lab">连对</span><b id="hud-streak">0</b></div>
    </div>

    <div class="play-top">
      <span class="play-cat" id="play-cat">分区</span>
      <span class="play-idx" id="play-idx">第 1 / 5 题</span>
    </div>
    <div class="dots" id="dots"></div>

    <div class="qbox">
      <div class="qbar"><i id="q-bar"></i></div>
      <p class="qtext" id="q-text">题目加载中…</p>
      <div class="opts" id="opts"></div>
      <p class="explain" id="explain" hidden></p>
    </div>

    <div class="stage-foot">
      <button id="btn-quit" class="btn btn-ghost" type="button">退出本局</button>
      <p class="tip">键盘 1-4 或 A-D 可以直接选答案。</p>
    </div>
  </section>

</main>

<!-- ================= 结算 ================= -->
<div class="modal" id="modal" hidden>
  <div class="modal-card">
    <h2 id="r-title">挑战结束</h2>
    <div class="big-score" id="r-score">0</div>
    <p class="modal-sub" id="r-sub">总分</p>
    <div class="stat-line"><span>分区</span><span id="r-cat">--</span></div>
    <div class="stat-line"><span>答对题数</span><span id="r-right">0 / 5</span></div>
    <div class="stat-line"><span>最高连对</span><span id="r-streak">0</span></div>
    <div class="stat-line"><span>平均用时</span><span id="r-avg">0s</span></div>
    <div class="stat-line"><span>评级</span><span id="r-rank">--</span></div>
    <div class="modal-actions">
      <button class="btn btn-primary" id="btn-again" type="button">再来一局</button>
      <button class="btn btn-ghost" id="btn-back" type="button">换分区</button>
    </div>
    <p class="pending">成绩暂未入库 · 接排行榜后这里会显示你的名次</p>
  </div>
</div>

<script th:src="@{/js/games/quiz.js}"></script>
</body>
</html>
