<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>知识闯关 · 魔识</title>
  <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}">
  <link rel="stylesheet" th:href="@{/css/game.css}">
  <link rel="stylesheet" th:href="@{/css/site.css}">
  <link rel="stylesheet" th:href="@{/css/theme.css}">
  <script th:src="@{/js/theme.js}"></script>
</head>
<body class="game-page">

<div th:replace="~{fragments/nav :: bar('quiz')}"></div>

<main class="stage wide">

  <!-- ================= 选难度 + 分区 ================= -->
  <section id="view-pick">
    <div class="pick-head">
      <h2>选难度 · 选分区，开始闯关</h2>
      <p>难度决定题数、限时与题目难度；答对按难度拿基础分并叠连击，答错扣分、连击清零。</p>
    </div>

    <div class="mode-grid" id="mode-grid">
      <div class="pick-loading">难度加载中…</div>
    </div>

    <div class="pick-grid" id="pick-grid">
      <div class="pick-loading">题库加载中…</div>
    </div>

    <p class="pick-tip" id="pick-tip"></p>
  </section>

  <!-- ================= 答题 ================= -->
  <section id="view-play" hidden>
    <div class="hud">
      <div class="hud-item"><span class="lab">进度</span><b id="hud-progress">1/5</b></div>
      <div class="hud-item"><span class="lab">本题剩余</span><b id="hud-time">15</b></div>
      <div class="hud-item"><span class="lab">已作答</span><b id="hud-answered">0</b></div>
      <div class="hud-item"><span class="lab">连击</span><b id="hud-combo">0</b></div>
      <div class="hud-item"><span class="lab">当前得分</span><b id="hud-score">0</b></div>
    </div>

    <div class="play-top">
      <span class="play-cat" id="play-cat">分区</span>
      <span class="play-idx" id="play-idx">第 1 / 5 题</span>
    </div>
    <div class="dots" id="dots"></div>

    <div class="qbox">
      <div class="qbar"><i id="q-bar"></i></div>
      <p class="qmeta" id="q-meta">难度：简单 · 本题 10 分</p>
      <p class="qtext" id="q-text">题目加载中…</p>
      <div class="opts" id="opts"></div>

      <div class="feedback" id="feedback" hidden>
        <div class="fb-head">
          <span class="fb-verdict" id="fb-verdict">✓ 答对了</span>
          <span class="fb-gain" id="fb-gain">+10</span>
        </div>
        <p class="fb-combo" id="fb-combo"></p>
        <p class="fb-explain" id="fb-explain"></p>
        <button class="btn btn-primary fb-next" id="btn-next" type="button">下一题 →</button>
      </div>
    </div>

    <div class="stage-foot">
      <button id="btn-quit" class="btn btn-ghost" type="button">退出本局</button>
      <p class="tip">键盘 1-4 或 A-D 选答案，答完后 Enter 进入下一题。</p>
    </div>
  </section>

</main>

<!-- ================= 结算 ================= -->
<div class="modal" id="modal" hidden>
  <div class="modal-card wide">
    <h2 id="r-title">本局结束</h2>
    <div class="big-score" id="r-score">0</div>
    <p class="modal-sub" id="r-sub">本局得分</p>
    <div class="stat-line"><span>答对题数</span><span id="r-right">0 / 5</span></div>
    <div class="stat-line"><span>最高连击</span><span id="r-maxcombo">0</span></div>
    <div class="stat-line"><span>得分构成</span><span id="r-breakdown">基础 0 + 连击 0 − 失误 0 + 速度 0</span></div>
    <div class="stat-line"><span>用时</span><span id="r-time">0s</span></div>
    <div class="stat-line"><span>成绩</span><span id="r-saved">—</span></div>

    <div class="detail-list" id="r-details"></div>

    <div class="modal-actions">
      <button class="btn btn-primary" id="btn-again" type="button">再来一局</button>
      <button class="btn btn-ghost" id="btn-back" type="button">换难度/分区</button>
    </div>
    <p class="pending" id="r-tip">成绩由服务端判分</p>
  </div>
</div>

<script th:src="@{/js/games/quiz.js}"></script>
</body>
</html>
