<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>排行榜 · 魔识</title>
  <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}">
  <link rel="stylesheet" th:href="@{/css/app.css}">
  <link rel="stylesheet" th:href="@{/css/site.css}">
  <link rel="stylesheet" th:href="@{/css/theme.css}">
  <script th:src="@{/js/theme.js}"></script>
</head>
<body>

<div th:replace="~{fragments/nav :: bar(${active})}"></div>

<main class="rank-wrap">

  <div class="rank-head">
    <h1>🏆 排行榜</h1>
    <span th:text="'共 ' + ${totalRecords} + ' 条成绩 · 当前：' + ${categoryName}">共 0 条成绩</span>
  </div>

  <div class="tabs">
    <a class="tab" th:classappend="${category == null} ? ' on'" th:href="@{/rank}">总榜</a>
    <a class="tab" th:each="c : ${categories}"
       th:classappend="${category == c.code} ? ' on'"
       th:href="@{/rank(category=${c.code})}">
      <span th:text="${c.icon}">💻</span>
      <span th:text="${c.name}">计算机</span>
    </a>
  </div>

  <div class="panel-box" th:if="${#lists.isEmpty(rows)}">
    <p class="soon-mini">
      这个榜单还没有成绩。<br>
      点顶部「答题中心」玩一局，交卷后成绩会自动入库并出现在这里。
    </p>
  </div>

  <section class="panel-box" th:unless="${#lists.isEmpty(rows)}">
    <table class="dt rank-table">
      <thead>
      <tr>
        <th style="width:64px">名次</th>
        <th>玩家</th>
        <th style="width:80px">得分</th>
        <th style="width:90px">答对</th>
        <th style="width:80px">用时</th>
        <th style="width:110px">时间</th>
      </tr>
      </thead>
      <tbody>
      <tr th:each="r : ${rows}">
        <td>
          <span class="rank-no"
                th:classappend="${r.rank <= 3} ? ' top'"
                th:text="${r.rank}">1</span>
        </td>
        <td th:text="${r.nickname}">玩家一号</td>
        <td><b th:text="${r.score}">120</b></td>
        <td th:text="${r.correct} + ' / ' + ${r.total}">4 / 5</td>
        <td th:text="${r.durationSeconds} + 's'">42s</td>
        <td th:text="${r.createdAt != null ? timeFmt.format(r.createdAt) : '—'}">10-23 12:00</td>
      </tr>
      </tbody>
    </table>
  </section>

  <p class="pf-note">排序规则：得分降序，同分按用时升序。得分 = 难度基础分 + 连击加成 − 失误扣分 + 速度加成。</p>

</main>

</body>
</html>
