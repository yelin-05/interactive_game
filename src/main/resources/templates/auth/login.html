<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>登录</title>
  <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}">
  <link rel="stylesheet" th:href="@{/css/app.css}">
  <link rel="stylesheet" th:href="@{/css/site.css}">
</head>
<body>

<div th:replace="~{fragments/nav :: bar(${active})}"></div>

<main class="auth-wrap">
  <div class="auth-card">
    <h1>登录</h1>
    <p class="auth-sub">登录后可以进个人中心、看自己的成绩</p>

    <div class="auth-msg ok" th:if="${param.registered != null}">注册成功，请用新账号登录</div>
    <div class="auth-msg bad" th:if="${error != null}" th:text="${error}">错误信息</div>

    <form class="auth-form" th:action="@{/login}" method="post">
      <input type="hidden" name="redirect" th:value="${redirect}">
      <label class="field">
        <span>用户名</span>
        <input class="input" type="text" name="username" th:value="${username}"
               required autocomplete="username" placeholder="3-20 位字母数字下划线">
      </label>
      <label class="field">
        <span>密码</span>
        <input class="input" type="password" name="password" required
               autocomplete="current-password" placeholder="至少 6 位">
      </label>
      <button class="btn btn-primary btn-block" type="submit">登录</button>
    </form>

    <p class="auth-foot">还没有账号？<a th:href="@{/register}">立即注册</a></p>

    <div class="auth-demo">
      <b>演示账号（种子数据）</b>
      <span>玩家：<code>player01</code> / <code>password</code></span>
      <span>管理员：<code>admin</code> / <code>password</code></span>
    </div>
  </div>
</main>

</body>
</html>
