<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>管理后台 · 魔识</title>
  <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}">
  <link rel="stylesheet" th:href="@{/css/app.css}">
  <link rel="stylesheet" th:href="@{/css/site.css}">
</head>
<body>

<div th:replace="~{fragments/nav :: bar(${active})}"></div>

<main class="admin-wrap">
  <div class="admin-head">
    <h1>管理后台</h1>
    <span>只读概览 · 增删改待题库编辑功能上线</span>
  </div>

  <div class="kpi-row">
    <div class="kpi"><b th:text="${userCount}">3</b><span>注册用户</span></div>
    <div class="kpi"><b th:text="${questionCount}">60</b><span>题库总题数</span></div>
    <div class="kpi"><b th:text="${#lists.size(categories)}">5</b><span>题库分区</span></div>
    <div class="kpi"><b th:text="${scoreCount}">0</b><span>成绩记录</span></div>
  </div>

  <section class="panel-box">
    <h2>各分区题量</h2>
    <table class="dt">
      <thead>
      <tr><th>分区</th><th>说明</th><th style="width:90px">题量</th></tr>
      </thead>
      <tbody>
      <tr th:each="c : ${categories}">
        <td><span class="tag-cat" th:text="${c.icon} + ' ' + ${c.name}">💻 计算机</span></td>
        <td th:text="${c.desc}">说明</td>
        <td th:text="${c.count}">12</td>
      </tr>
      </tbody>
    </table>
  </section>

  <section class="panel-box">
    <h2>最新入库题目</h2>
    <table class="dt">
      <thead>
      <tr><th style="width:60px">ID</th><th>题干</th><th style="width:36%">解析</th></tr>
      </thead>
      <tbody>
      <tr th:each="q : ${recentQuestions}">
        <td th:text="${q.id}">1</td>
        <td th:text="${q.question}">题干</td>
        <td class="clamp3" th:text="${q.explanation}">解析</td>
      </tr>
      </tbody>
    </table>
  </section>

  <section class="panel-box">
    <h2>最近注册用户</h2>
    <table class="dt">
      <thead>
      <tr><th style="width:80px">ID</th><th>用户名</th><th>昵称</th><th style="width:90px">角色</th></tr>
      </thead>
      <tbody>
      <tr th:each="u : ${recentUsers}">
        <td th:text="${u.id}">1</td>
        <td th:text="${u.username}">player01</td>
        <td th:text="${u.nickname}">玩家一号</td>
        <td th:text="${u.role}">PLAYER</td>
      </tr>
      </tbody>
    </table>
  </section>
</main>

</body>
</html>
