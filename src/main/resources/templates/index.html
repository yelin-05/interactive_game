<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${appName} + ' v' + ${appVersion}">互动Web小游戏</title>
  <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>

<header class="hero">
  <span class="badge">Java EE 期末大作业</span>
  <h1 th:text="${appName}">互动Web小游戏·任务与素材管理</h1>
  <p class="sub">任务中心 · 素材库 · 排行榜 · 大模型生成占位</p>
  <div class="hero-actions">
    <a class="btn btn-primary" th:href="@{/games}">试玩游戏模板 →</a>
    <button id="btn-check" class="btn" type="button">系统自检</button>
    <a class="btn" th:href="@{/actuator/health}" target="_blank" rel="noopener">健康检查 JSON</a>
  </div>
</header>

<main>
  <section class="grid">
    <article class="card" th:each="m, st : ${modules}">
      <div class="card-top">
        <span class="code" th:text="${m.code}">task</span>
        <span class="tag" th:text="${m.status}">骨架就绪</span>
      </div>
      <h2 th:text="${m.name}">任务中心</h2>
      <p th:text="${m.desc}">描述</p>
    </article>
  </section>

  <section class="panel" id="panel" hidden>
    <div class="panel-head">
      <h2>系统自检</h2>
      <span class="pill" id="verdict">检测中…</span>
    </div>
    <table class="kv">
      <tbody id="kv-body"></tbody>
    </table>
    <p class="hint" id="hint"></p>
  </section>
</main>

<footer>
  <span th:text="'v' + ${appVersion}">v0.1.0</span>
  <span class="dot">·</span>
  <span>Spring Boot 3 · MyBatis-Plus · Thymeleaf</span>
</footer>

<script th:src="@{/js/app.js}"></script>
</body>
</html>
