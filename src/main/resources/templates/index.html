<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${appName} + ' v' + ${appVersion}">魔识</title>
  <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}">
  <link rel="stylesheet" th:href="@{/css/app.css}">
  <link rel="stylesheet" th:href="@{/css/site.css}">
</head>
<body>

<div th:replace="~{fragments/nav :: bar('home')}"></div>

<header class="hero">
  <h1 th:text="${appName}">魔识</h1>
  <p class="sub">互动答题 · 任务 · 素材库 · 排行榜</p>

  <div class="hero-actions">
    <button id="btn-check" class="btn" type="button">系统自检</button>
    <a class="btn btn-ghost-sm" th:href="@{/actuator/health}" target="_blank" rel="noopener">健康检查</a>
    <a class="btn btn-ghost-sm" th:if="${session.LOGIN_NICKNAME == null}" th:href="@{/register}">注册新账号</a>
  </div>
</header>

<main>
  <section class="module-row">
    <article class="mod" th:each="m : ${modules}">
      <span class="mod-icon" th:text="${m.icon}">📋</span>
      <div class="mod-body">
        <div class="mod-head">
          <span class="mod-name" th:text="${m.name}">任务中心</span>
          <span class="mod-tag" th:text="${m.status}">骨架就绪</span>
        </div>
        <p class="mod-desc" th:text="${m.desc}">说明</p>
      </div>
    </article>
  </section>

  <section class="panel" id="panel" hidden>
    <div class="panel-head">
      <h2>系统自检</h2>
      <span class="pill" id="verdict">检测中…</span>
    </div>
    <table class="kv">
      <tbody id="kv-body"></tbody>
    </table>
    <p class="hint" id="hint"></p>
  </section>
</main>

<footer>
  <span th:text="'v' + ${appVersion}">v0.1.0</span>
  <span class="dot">·</span>
  <span>Spring Boot 3 · MyBatis-Plus · Thymeleaf</span>
</footer>

<script th:src="@{/js/app.js}"></script>
</body>
</html>
