<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>素材库</title>
  <link rel="stylesheet" th:href="@{/css/app.css}">
  <link rel="stylesheet" th:href="@{/css/site.css}">
</head>
<body>

<div th:replace="~{fragments/nav :: bar(${active})}"></div>

<main class="page-wrap">
  <div class="page-head">
    <h1>🖼️ 素材库</h1>
    <span th:text="'共 ' + ${total} + ' 个素材'">共 0 个素材</span>
  </div>

  <div class="auth-msg ok" th:if="${okMsg != null}">上传成功</div>
  <div class="auth-msg bad" th:if="${error != null}" th:text="${error}">错误</div>

  <section class="panel-box" th:if="${loggedIn}">
    <h2>上传素材</h2>
    <form class="upload-form" th:action="@{/assets/upload}" method="post" enctype="multipart/form-data">
      <label class="field">
        <span>名称（选填）</span>
        <input class="input" type="text" name="name" placeholder="不填就用文件名">
      </label>
      <label class="field">
        <span>归类</span>
        <select class="input" name="category">
          <option value="">不归类</option>
          <option th:each="c : ${categories}" th:value="${c.code}" th:text="${c.name}">计算机</option>
        </select>
      </label>
      <label class="field">
        <span>图片（png / jpg / jpeg / gif / webp，≤10MB）</span>
        <input class="input" type="file" name="file" accept="image/*" required>
      </label>
      <button class="btn btn-primary" type="submit">上传</button>
    </form>
  </section>

  <div class="auth-msg bad" th:unless="${loggedIn}">
    浏览不需要登录，上传需要先 <a class="inline-link" th:href="@{/login(redirect='/assets')}">登录</a>。
  </div>

  <div class="tabs">
    <a class="tab" th:classappend="${category == null} ? ' on'" th:href="@{/assets}">全部</a>
    <a class="tab" th:each="c : ${categories}"
       th:classappend="${category == c.code} ? ' on'"
       th:href="@{/assets(category=${c.code})}">
      <span th:text="${c.icon}">💻</span>
      <span th:text="${c.name}">计算机</span>
    </a>
  </div>

  <div class="asset-grid" th:unless="${#lists.isEmpty(assets)}">
    <figure class="asset" th:each="a : ${assets}">
      <img th:src="@{'/uploads/' + ${a.storedPath}}" th:alt="${a.name}" loading="lazy">
      <figcaption>
        <b th:text="${a.name}">素材名</b>
        <span th:text="${a.sizeBytes != null} ? ${#numbers.formatInteger(a.sizeBytes / 1024, 0)} + ' KB' : ''">12 KB</span>
      </figcaption>
    </figure>
  </div>

  <div class="panel-box" th:if="${#lists.isEmpty(assets)}">
    <p class="soon-mini">这个分类还没有素材。</p>
  </div>

  <p class="pf-note">
    文件存在磁盘 <code>uploads/</code>（已加入 .gitignore），库里只存相对路径；
    上传时只放行图片后缀，落盘文件名用 UUID 重生成，防止路径穿越。
  </p>
</main>

</body>
</html>
