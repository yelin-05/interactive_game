<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>个人中心</title>
  <link rel="stylesheet" th:href="@{/css/app.css}">
  <link rel="stylesheet" th:href="@{/css/site.css}">
</head>
<body>

<div th:replace="~{fragments/nav :: bar(${active})}"></div>

<main class="pf-wrap">

  <section class="pf-user">
    <div class="pf-avatar" th:text="${initial}">玩</div>
    <div class="pf-meta">
      <h1>
        <span th:text="${nickname}">玩家一号</span>
        <span class="pf-role" th:text="${roleLabel}">玩家</span>
      </h1>
      <p class="pf-line">@<span th:text="${user.username}">player01</span></p>
      <p class="pf-line dim" th:text="'注册于 ' + ${joinedAt}">注册于 —</p>
    </div>
  </section>

  <section class="pf-stats">
    <div class="pf-stat"><b th:text="${stats.rounds}">0</b><span>累计答题</span></div>
    <div class="pf-stat"><b th:text="${stats.bestScore}">0</b><span>最高分</span></div>
    <div class="pf-stat"><b th:text="${stats.accuracyPercent} + '%'">0%</b><span>正确率</span></div>
    <div class="pf-stat"><b th:text="${stats.globalRank == 0 ? '--' : stats.globalRank}">--</b><span>总榜名次</span></div>
  </section>
  <p class="pf-note">数据来自 <code>t_score</code> 表，仅统计已登录状态下完成的答题（未登录也能玩，但成绩不入库）。</p>

  <section class="pf-panel">
    <h2>最近战绩</h2>

    <div class="pf-empty" th:if="${#lists.isEmpty(recent)}">
      <p>还没有答题记录</p>
      <a class="btn btn-primary" th:href="@{/games/quiz}">去答一局 →</a>
    </div>

    <table class="dt" th:unless="${#lists.isEmpty(recent)}">
      <thead>
      <tr>
        <th style="width:110px">时间</th>
        <th>分区</th>
        <th style="width:70px">得分</th>
        <th style="width:80px">答对</th>
        <th style="width:70px">用时</th>
      </tr>
      </thead>
      <tbody>
      <tr th:each="s : ${recent}">
        <td th:text="${s.createdAt != null ? recentTimeFmt.format(s.createdAt) : '—'}">10-23 12:00</td>
        <td th:text="${categoryNames.getOrDefault(s.category, s.category)}">历史</td>
        <td><b th:text="${s.score}">120</b></td>
        <td th:text="${s.correctCount} + ' / ' + ${s.totalCount}">4 / 5</td>
        <td th:text="${s.durationMs / 1000} + 's'">42s</td>
      </tr>
      </tbody>
    </table>

    <p class="pf-note" th:unless="${#lists.isEmpty(recent)}">
      <a th:href="@{/rank}" class="inline-link">去排行榜看完整名次 →</a>
    </p>
  </section>

  <section class="pf-panel">
    <h2>账号</h2>
    <p class="pf-note">
      当前页面展示的是<b>已登录用户</b>，登录态保存在 HTTP Session 里，密码以 BCrypt 摘要存储。<br>
      修改昵称、上传头像、退出登录等功能后续补充（退出在右上角导航栏）。
    </p>
  </section>

</main>

</body>
</html>
