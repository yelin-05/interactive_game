# =====================================================================
#  公共配置
#  切换数据源：默认 mysql；演示/无库环境用 --spring.profiles.active=h2
# =====================================================================
app:
  name: 互动Web小游戏·任务与素材管理
  version: 0.1.0
  # 大模型占位：mock 用本地假数据（离线可演示），real 走真实接口
  llm:
    mode: mock
    base-url: https://api.deepseek.com/v1/chat/completions
    model: deepseek-chat
    # 真实 Key 只从环境变量读，绝不写进仓库
    api-key: ${LLM_API_KEY:}
    timeout-seconds: 20

server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  application:
    name: minigame-asset
  profiles:
    # 想默认跑 MySQL 就保持 mysql；答辩前可用 h2 做兜底演示
    active: mysql
  thymeleaf:
    cache: false
  jackson:
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false
  servlet:
    multipart:
      # 素材库上传限制：单文件 10MB，单请求 20MB
      max-file-size: 10MB
      max-request-size: 20MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    # 开发期打印 SQL，上线改成 info
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false
    db-config:
      id-type: auto
  mapper-locations: classpath*:/mapper/**/*.xml

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: info
    com.example.minigame: debug
