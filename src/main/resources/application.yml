# =====================================================================
#  公共配置
#  切换数据源：默认 mysql；演示/无库环境用 --spring.profiles.active=h2
# =====================================================================
app:
  name: 魔识
  version: 0.1.0
  # 大模型：mock 用本地模板拼题（离线可演示），real 走 OpenAI 兼容的真实接口
  # 接入真实模型只要两个环境变量：set LLM_MODE=real  和  set LLM_API_KEY=你的Key
  # （也可以写进 src/main/resources/application-local.yml，那个文件不进仓库）
  llm:
    mode: ${LLM_MODE:mock}
    base-url: ${LLM_BASE_URL:https://api.deepseek.com/v1/chat/completions}
    model: ${LLM_MODEL:deepseek-chat}
    # 真实 Key 只从环境变量 / application-local.yml 读，绝不写进仓库
    api-key: ${LLM_API_KEY:}
    timeout-seconds: ${LLM_TIMEOUT_SECONDS:20}
    # OpenAI 系用 response_format=json_object 强制模型只回 JSON；
    # 本机 Ollama 等不支持这个参数，接它们时设 LLM_JSON_FORMAT=false
    json-format: ${LLM_JSON_FORMAT:true}
    # /llm 页面「接入大模型」保存后写到这里（含 Key，已在 .gitignore），重启后仍然生效；
    # 存在该文件时它会覆盖上面的环境变量值，删除文件即可回退到 application.yml
    settings-file: ${LLM_SETTINGS_FILE:config/llm-settings.local.json}
  # 题库自动补充：让游戏自己调大模型出题并入库
  quiz:
    auto-fill:
      # 总开关：关掉后后台按钮也不会执行
      enabled: true
      # 启动时自动补一次（首次部署想让它自己把题补满就打开）
      on-startup: false
      # 定时补题，"-" 表示关闭；例：0 0 3 * * *（每天 3 点）
      cron: "-"
      # mock 通道生成的是占位题，默认不写进正式题库（离线演示链路时才临时打开）
      allow-mock: false
      # 单次运行最多入库多少道，避免一次跑太久
      max-per-run: 12
      # 每个分区的目标题量：困难档一局抽 10 题（难度 2+3），所以中等+困难要留余量
      target:
        easy: 8
        normal: 6
        hard: 6

server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  application:
    name: moshi
  config:
    # 本地私有配置（真实 API Key / 数据库密码）放这里，文件不存在也不报错；
    # 该文件已在 .gitignore 里，真实密钥不会被提交
    import: optional:classpath:application-local.yml
  profiles:
    # 想默认跑 MySQL 就保持 mysql；答辩前可用 h2 做兜底演示
    active: mysql
  thymeleaf:
    cache: false
  jackson:
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false
  servlet:
    multipart:
      # 素材库上传限制：单文件 10MB，单请求 20MB
      max-file-size: 10MB
      max-request-size: 20MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    # 开发期打印 SQL，上线改成 info
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false
    db-config:
      id-type: auto
  mapper-locations: classpath*:/mapper/**/*.xml

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: info
    com.example.minigame: debug
